<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="14" fill="url(#sbGrad)"/>
  <!-- Subtle border highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Monogram text -->
  <text x="32" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">SB</text>
</svg>
